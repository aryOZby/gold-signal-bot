timezone: Asia/Jerusalem
dry_run: true

telegram:
  session_name: gold_signal_bot
  groups:
    # אסטרטגיה א': מדלגים על 2 שורות TP, קידום סטופים אחרי שורה 3.
    - name: group_a
      chat_id: -2001216034
      lot: 0.01
      magic: 260908
      skip_first_tps: 2
      breakeven_after_tp: 3
    - name: TechnicalPips6273
      username: TechnicalPips6273
      lot: 0.01
      magic: 260909
      skip_first_tps: 2
      breakeven_after_tp: 3
    # אסטרטגיה ב': נכנסים בכל שורות ה-TP, קידום סטופים כבר אחרי הראשונה.
    # - name: group_c
    #   username: SomeOtherGroup
    #   lot: 0.01
    #   magic: 260910
    #   skip_first_tps: 0
    #   breakeven_after_tp: 1
  admin_chat_id: 0

trading:
  symbol_override: ""
  max_concurrent_signals: 1
  # מדלגים על שתי שורות ה-TP הראשונות ולא נכנסים בהן בכלל.
  # המספור נשמר לפי מספר השורה במקור, כך ש-TP3 נשאר TP3 בדוחות.
  skip_first_tps: 2
  # קידום כל הסטופים לנקודת הכניסה אחרי נגיעה ב-TP של שורה 3.
  breakeven_after_tp: 3
  safety_delay_seconds: 5
  safety_pips: 50
  # שומר בלתי תלוי באסטרטגיה: כל כמה שניות לסרוק פוזיציות ולכפות SL/TP.
  guard_interval_seconds: 5
  pip_size: 0.1
  magic_number: 260908
  deviation: 30
  order_retries: 1

broker:
  # On a Windows VPS with MT5 installed, change to mt5_native and set dry_run: false
  type: dry_run
  common_files_dir: ""

excel:
  output_dir: reports
  daily_digest_hour: 23
  daily_digest_minute: 55

paths:
  data_dir: data
  logs_dir: logs
